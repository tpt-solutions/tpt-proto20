[package]
name = "tpt20-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Conformance and testing suite for tpt20 (spec §22)"
keywords = ["tpt20", "testing", "conformance", "validation", "fuzzing"]
categories = ["development-tools", "testing"]

[dependencies]
tpt20-core = { path = "../../runtime/tpt20-core" }
tpt20-json = { path = "../../runtime/tpt20-json" }
tpt20-reflect = { path = "../../runtime/tpt20-reflect" }
tpt20-rpc = { path = "../../runtime/tpt20-rpc" }
tpt20-compiler = { path = "../../compiler/tpt20-compiler" }
tpt20-codegen-rust = { path = "../../compiler/tpt20-codegen-rust" }
tpt20-descriptor = { path = "../../compiler/tpt20-descriptor" }
tpt20-ir = { path = "../../compiler/tpt20-ir" }
tpt20-language = { path = "../../compiler/tpt20-language" }
tpt20-compat-protobuf = { path = "../../compat/tpt20-compat-protobuf" }
tpt20-compat-grpc = { path = "../../compat/tpt20-compat-grpc" }
tpt20-stdlib = { path = "../../runtime/tpt20-stdlib" }
thiserror.workspace = true
serde_json.workspace = true
base64 = "0.22"
proptest = "1.5"

[dev-dependencies]
tempfile = "3.10"
