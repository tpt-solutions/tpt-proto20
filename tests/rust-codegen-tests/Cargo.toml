[package]
name = "tpt20-codegen-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Compile-and-run tests for generated Rust code (todo Phase 5)"
keywords = ["tpt20", "tests", "codegen", "testing"]
categories = ["development-tools", "testing"]

[dependencies]
tpt20-core = { path = "../../runtime/tpt20-core" }
tpt20-json = { path = "../../runtime/tpt20-json" }
tpt20-rpc = { path = "../../runtime/tpt20-rpc" }

[build-dependencies]
tpt20-compiler = { path = "../../compiler/tpt20-compiler" }
tpt20-codegen-rust = { path = "../../compiler/tpt20-codegen-rust" }

[dev-dependencies]
tpt20-rpc = { path = "../../runtime/tpt20-rpc", features = ["http2"] }
tpt20-transport = { path = "../../runtime/tpt20-transport", features = ["http2"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
