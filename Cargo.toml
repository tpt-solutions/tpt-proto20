[workspace]
resolver = "2"
members = [
    "compiler/tpt20-language",
    "compiler/tpt20-ir",
    "compiler/tpt20-descriptor",
    "compiler/tpt20-compiler",
    "compiler/tpt20-codegen-rust",
    "compiler/tpt20-codegen-backends",
    "runtime/tpt20-core",
    "runtime/tpt20-reflect",
    "runtime/tpt20-json",
    "runtime/tpt20-text",
    "runtime/tpt20-stdlib",
    "runtime/tpt20-rpc",
    "runtime/tpt20-transport",
    "compat/tpt20-compat-protobuf",
    "compat/tpt20-compat-grpc",
    "tools/tpt20-cli",
    "tools/tpt20-lint",
    "tools/tpt20-diff",
    "tools/tpt20-conformance",
    "tools/tpt20-registry",
    "tests/rust-codegen-tests",
    "tests/conformance",
    "fuzz/binary_decoder",
    "fuzz/json_decoder",
    "fuzz/text_parser",
    "fuzz/schema_parser",
    "fuzz/descriptor_decoder",
    "fuzz/dynamic_message_decoder",
    "fuzz/rpc_framing",
    "fuzz/metadata_parsing",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/TPT-Solutions/tpt-proto20"
rust-version = "1.74"

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
