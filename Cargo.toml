[workspace]
resolver = "2"
members = [
    "compiler/tpt20-language",
    "compiler/tpt20-ir",
    "compiler/tpt20-descriptor",
    "compiler/tpt20-compiler",
    "runtime/tpt20-core",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/TPT-Solutions/tpt-proto20"
rust-version = "1.74"

[workspace.dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
