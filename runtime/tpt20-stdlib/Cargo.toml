[package]
name = "tpt20-stdlib"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Standard library types for tpt20 (spec §15)"
keywords = ["tpt20", "stdlib", "standard-library", "timestamp", "duration", "uuid"]
categories = ["encoding"]

[dependencies]
tpt20-core = { path = "../../runtime/tpt20-core" }
tpt20-json = { path = "../../runtime/tpt20-json" }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true }
base64 = "0.22"

[features]
serde = ["dep:serde"]
