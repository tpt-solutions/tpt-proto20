[package]
name = "tpt20-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Transport layer for tpt20 (spec §17, §18.6)"
keywords = ["tpt20", "transport", "http2", "tls", "networking", "async"]
categories = ["network-programming", "asynchronous"]

[dependencies]
thiserror.workspace = true
bytes = "1"
futures = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
http = { version = "1", optional = true }
h2 = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }

[features]
default = ["in_process"]
in_process = []
http2 = ["dep:h2", "dep:http", "dep:flate2"]
tls = ["http2", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]
rustls = ["tls"]
quic = ["tls", "dep:quinn"]

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["logging", "tls12", "ring", "std"]
optional = true

[dependencies.tokio-rustls]
version = "0.26"
default-features = false
